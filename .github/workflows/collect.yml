name: collect-velib

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum interval; real runs are often delayed by a few minutes
  workflow_dispatch: {}      # manual trigger, handy for testing

permissions:
  contents: write            # required to publish files in Releases

concurrency:
  group: velib-collect       # never run two collections at once: they would race on the day's file
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/velib
            requirements-collect.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - run: pip install -r requirements-collect.txt

      - name: Collect and publish
        run: python -m velib.ingestion.collect collect --upload
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
